pre-commit:
  parallel: true
  commands:
    ruff-imports:
      # Import sorting is ruff's job: isort is not a dev dependency, so the
      # old isort step always fell through to this fallback -- and isort's
      # black profile can order imports differently from ruff's isort rules,
      # which made the two steps fight over the same lines.
      glob: "*.py"
      run: |
        if command -v uv >/dev/null 2>&1; then
          uv run ruff check --select I --fix {staged_files}
        else
          ruff check --select I --fix {staged_files}
        fi
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      run: |
        if command -v uv >/dev/null 2>&1; then
          uv run ruff format {staged_files}
        else
          ruff format {staged_files}
        fi
      stage_fixed: true
    ruff-lint:
      glob: "*.py"
      run: |
        if command -v uv >/dev/null 2>&1; then
          uv run ruff check --fix {staged_files}
        else
          ruff check --fix {staged_files}
        fi
      stage_fixed: true


# pre-push hook removed - tests run in CI only
